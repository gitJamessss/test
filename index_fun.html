<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hip OA VR Exercise Demo (Fun Edition)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
  #overlay {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 8px 12px; background: rgba(0,0,0,0.4);
    color: #fff; font-size: 14px; z-index: 10;
  }
  #debug {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 6px 10px; background: rgba(0,0,0,0.6);
    color: #0f0; font-size: 11px; z-index: 10; white-space: pre-line;
  }
</style>
</head>
<body>
<div id="overlay">
  <div><b>Hip OA VR Exercise Demo</b> - Fun Edition for Meta Quest 3.</div>
  <div>Steps: 1) Host via HTTPS (e.g. GitHub Pages). 2) Open in Quest Browser. 3) Tap "Enter VR".</div>
  <div>Now with a rainbow sky, silly floating clouds, and a disco ball. Red sphere still marks world origin.</div>
</div>
<div id="debug"></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";
import { VRButton } from "https://unpkg.com/three@0.165.0/examples/jsm/webxr/VRButton.js";

const debugEl = document.getElementById('debug');
function logDebug(msg) {
  console.log(msg);
  debugEl.textContent = msg;
}

logDebug("Secure context (HTTPS/localhost): " + window.isSecureContext);
if (!window.isSecureContext) {
  logDebug("WARNING: WebXR requires HTTPS or localhost. Host via GitHub Pages.");
}
if (!('xr' in navigator)) {
  logDebug("navigator.xr NOT found - WebXR not available in this browser.");
} else {
  navigator.xr.isSessionSupported('immersive-vr')
    .then(supported => logDebug("immersive-vr supported: " + supported))
    .catch(err => logDebug("Error checking isSessionSupported: " + err));
}

const canvas = document.createElement('canvas');
const gl = canvas.getContext('webgl2', { xrCompatible: true, antialias: false });

const renderer = new THREE.WebGLRenderer({ canvas, context: gl, antialias: false });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

canvas.addEventListener('webglcontextlost', (event) => {
  event.preventDefault();
  renderer.setAnimationLoop(null);
  logDebug("WebGL context LOST - animation paused.");
}, false);
canvas.addEventListener('webglcontextrestored', () => {
  logDebug("WebGL context RESTORED - resuming.");
  renderer.setAnimationLoop(renderScene);
}, false);

const scene = new THREE.Scene();

// ---------- FUNNY RAINBOW SKY ----------
// Drawn procedurally on an in-memory canvas (no external image download needed,
// so this can't cause a network stall or CDN-related loading freeze).
function makeRainbowSkyTexture() {
  const w = 1024, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0.0, '#ff3b3b');
  grad.addColorStop(0.17, '#ff9d3b');
  grad.addColorStop(0.34, '#fff23b');
  grad.addColorStop(0.5, '#3bff6b');
  grad.addColorStop(0.67, '#3bd4ff');
  grad.addColorStop(0.84, '#7a3bff');
  grad.addColorStop(1.0, '#ff3bd8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Silly cartoon sun with sunglasses
  ctx.save();
  ctx.translate(180, 120);
  ctx.fillStyle = '#fff9a0';
  ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.fillRect(-45, -12, 35, 22);
  ctx.fillRect(10, -12, 35, 22);
  ctx.fillRect(-10, -6, 20, 8);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-55, -10); ctx.lineTo(-65, -18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(45, -10); ctx.lineTo(55, -18); ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-20, 40, 6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, 55); ctx.quadraticCurveTo(0, 75, 30, 55); ctx.lineWidth=5; ctx.stroke();
  ctx.restore();

  // Big goofy smiling clouds
  function drawCloud(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    [[0,0,40],[-35,10,30],[35,10,30],[-15,-15,28],[15,-15,28]].forEach(p => {
      ctx.beginPath(); ctx.arc(p[0], p[1], p[2], 0, Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-15, 5, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(15, 5, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 15, 12, 0, Math.PI); ctx.fill();
    ctx.restore();
  }
  drawCloud(650, 100, 1.3);
  drawCloud(850, 220, 0.9);
  drawCloud(420, 260, 1.0);

  // Banner text
  ctx.font = 'bold 40px system-ui, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#00000055';
  ctx.lineWidth = 4;
  ctx.textAlign = 'center';
  ctx.strokeText("YOU'VE GOT THIS! \u{1F4AA}", w/2, h - 60);
  ctx.fillText("YOU'VE GOT THIS! \u{1F4AA}", w/2, h - 60);

  return c;
}

const skyCanvas = makeRainbowSkyTexture();
const skyTexture = new THREE.CanvasTexture(skyCanvas);
skyTexture.colorSpace = THREE.SRGBColorSpace;
const skyGeo = new THREE.SphereGeometry(50, 32, 32);
const skyMat = new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide });
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 0.2);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(hemiLight);

// Bright red world-origin debug marker (kept from stable build)
const originMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.15, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
originMarker.position.set(0, 1.2, -1);
scene.add(originMarker);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.MeshBasicMaterial({ color: 0x303030 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// ---------- Disco ball for comic relief ----------
const discoBall = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.25, 1),
  new THREE.MeshStandardMaterial({ color: 0xdddddd, flatShading: true, metalness: 0.9, roughness: 0.2 })
);
discoBall.position.set(0, 2.3, -1.5);
scene.add(discoBall);

const discoLight1 = new THREE.PointLight(0xff00ff, 3, 5);
discoLight1.position.copy(discoBall.position);
scene.add(discoLight1);
const discoLight2 = new THREE.PointLight(0x00ffff, 3, 5);
discoLight2.position.copy(discoBall.position);
scene.add(discoLight2);

// ---------- Exercise objects (unchanged from stable build) ----------
const legTargetGeo = new THREE.BoxGeometry(0.2, 0.1, 0.5);
const legTarget = new THREE.Mesh(
  legTargetGeo,
  new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true })
);
legTarget.position.set(0.15, 0.5, -0.7);
scene.add(legTarget);

const avatarThigh = new THREE.Mesh(
  new THREE.BoxGeometry(0.15, 0.1, 0.4),
  new THREE.MeshBasicMaterial({ color: 0x00aaff })
);
avatarThigh.position.set(-0.15, 0.5, -0.7);
scene.add(avatarThigh);

const tracker = new THREE.Mesh(
  new THREE.SphereGeometry(0.06, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
tracker.position.set(0.0, 0.4, -0.9);
scene.add(tracker);

const controller = renderer.xr.getController(0);
scene.add(controller);
controller.addEventListener('connected', (event) => {
  logDebug("Controller connected: " + JSON.stringify(event.data.handedness || event.data));
});
controller.addEventListener('disconnected', () => logDebug("Controller disconnected"));

let reps = 0;
let score = 0;
let inTarget = false;
let timeInTarget = 0;
const clock = new THREE.Clock();

function renderScene() {
  const delta = clock.getDelta();
  const t = clock.getElapsedTime();

  // Slowly rotate the whole sky for a playful drifting effect
  sky.rotation.y = t * 0.02;

  // Spin the disco ball and cycle its lights
  discoBall.rotation.y = t * 1.2;
  discoLight1.position.x = discoBall.position.x + Math.sin(t * 2) * 0.3;
  discoLight2.position.x = discoBall.position.x - Math.sin(t * 2) * 0.3;
  discoLight1.color.setHSL((t * 0.1) % 1, 1, 0.5);
  discoLight2.color.setHSL((t * 0.1 + 0.5) % 1, 1, 0.5);

  const lift = Math.sin(t * 1.5) * 0.15;
  avatarThigh.position.y = 0.5 + lift;
  legTarget.position.y = 0.5 + lift * 0.6;

  tracker.position.copy(controller.position);

  const dx = Math.abs(tracker.position.x - legTarget.position.x);
  const dy = Math.abs(tracker.position.y - legTarget.position.y);
  const dz = Math.abs(tracker.position.z - legTarget.position.z);
  const inside = dx < 0.1 && dy < 0.05 && dz < 0.25;

  if (inside) {
    legTarget.material.color.set(0x00ff00);
    timeInTarget += delta;
    if (!inTarget) inTarget = true;
    if (timeInTarget > 1.2) {
      reps += 1;
      score += 10;
      timeInTarget = 0;
      logDebug("Reps: " + reps + " | Score: " + score);
    }
  } else {
    legTarget.material.color.set(0xffff00);
    inTarget = false;
    timeInTarget = 0;
  }

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(renderScene);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
